name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GOOSE_HOME: ${{ runner.temp }}/goose-home
    steps:
      - uses: actions/checkout@v4

      - name: Install the latest Goose release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/goose"
          mkdir -p "$dest"
          tag=$(gh release view -R aardappel/goose --json tagName -q .tagName)
          case "$RUNNER_OS" in
            Linux) asset="linux-x64.tar.gz" ;;
            macOS) asset="macos-arm64.tar.gz" ;;
          esac
          gh release download "$tag" -R aardappel/goose -p "*-$asset" -D "$dest" --clobber
          tar -xzf "$dest"/*-"$asset" -C "$dest"
          exe=$(find "$dest" -type f -name goose | head -1)
          chmod +x "$exe"
          echo "$(dirname "$exe")" >> "$GITHUB_PATH"
          goose --version

      - name: Check the entry file
        run: goose check xml.goose

      - name: Run the test suite
        run: goose run test/run.goose
