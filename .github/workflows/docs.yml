name: docs

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'test/docs_check.py'
  pull_request:
    paths:
      - '**/*.md'
      - 'test/docs_check.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check the documents
        run: python3 test/docs_check.py
